<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的班表">
<meta name="theme-color" content="#0f766e">
<meta name="color-scheme" content="light dark">
<title>我的班表</title>
<link rel="apple-touch-icon" id="touchIcon" href="data:,">
<style>
:root{
  --bg:#f3f6f5;--card:#fff;--ink:#14201e;--muted:#667674;--line:#e0e8e6;
  --brand:#0f766e;--brand-ink:#fff;--soft:#e5f3f0;--danger:#c0392b;--warn:#a8680f;--warn-bg:#fdf3e1;--err-bg:#fdeceb;--ok-bg:#dff5e8;--ok:#17743d;
  --c-early:#0f9d8a;--c-day:#e8833a;--c-eve:#4f6bed;--c-night:#8b5cc7;--c-other:#8a9794;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(15,60,55,.07);--r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1413;--card:#152120;--ink:#e8f1ef;--muted:#8da19e;--line:#243430;--brand:#35b8a8;--brand-ink:#04211e;--soft:#16302c;
    --danger:#ff8070;--warn:#e3b45c;--warn-bg:#2b2410;--err-bg:#331a17;--ok-bg:#12301f;--ok:#6fdca0;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom));min-height:100vh}
#app{max-width:640px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
h2{font-size:22px;margin:8px 0 6px}
h3{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
p{margin:6px 0}
.muted{color:var(--muted)}.small{font-size:13px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:18px}
.who{font-size:13px;color:var(--muted);text-align:right;line-height:1.3}
main{padding:14px 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--brand);color:var(--brand-ink);padding:11px 18px;border-radius:11px;font-weight:600;cursor:pointer;text-decoration:none;min-height:44px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{background:none;border:0;color:var(--brand);padding:6px 0;cursor:pointer;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}
label.f{display:block;margin:12px 0 4px;font-size:14px;color:var(--muted)}
input[type=text],input[type=date],input[type=time],textarea,select,.select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);outline:none;text-align:left;min-height:46px}
input:focus,textarea:focus,select:focus{border-color:var(--brand)}
textarea{min-height:96px;resize:vertical}
textarea.mono{font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:150px}
.select{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px;display:none}.msg.show{display:block}
.msg.err{background:var(--err-bg);color:var(--danger)}.msg.warn{background:var(--warn-bg);color:var(--warn)}.msg.ok{background:var(--ok-bg);color:var(--ok)}
.auth{padding:calc(36px + env(safe-area-inset-top)) 20px 30px}
.auth h1{font-size:28px;margin:0 0 4px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs .in{display:flex;width:100%;max-width:640px}
.tab{flex:1;background:none;border:0;padding:9px 0 8px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--brand);font-weight:700}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mhead .t{font-size:20px;font-weight:700}
.nav{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cell{position:relative;min-height:62px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink);overflow:hidden}
.cell.empty{border:0;background:none;cursor:default}
.cell.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cell.sel{background:var(--soft);border-color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
.cell.dim{opacity:.45}
.cell .dn{font-size:13px;font-weight:600;color:var(--muted)}
.cell.today .dn{color:var(--brand)}
.cell.static{cursor:default}
.cell .star{position:absolute;top:2px;right:4px;font-size:11px;color:var(--c-day)}
.chip{display:flex;flex-direction:column;align-items:center;line-height:1.15;border-top:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:5px;padding:2px 3px;width:calc(100% - 6px);font-weight:700;font-size:13px}
.chip small{font-size:10px;font-weight:500;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:10px 2px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.empty-card{text-align:center;padding:22px 16px}
.pill{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--soft);color:var(--brand)}
.pill.gray{background:var(--bg);color:var(--muted)}.pill.duty{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.no{background:var(--err-bg);color:var(--danger)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;z-index:21;padding:8px 18px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:18px;padding:20px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h3{font-size:18px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px;white-space:pre-wrap;word-break:break-word}
.fchip{border:1.5px solid var(--line);background:none;border-radius:20px;padding:8px 16px;font-size:15px;white-space:nowrap;cursor:pointer;min-height:40px}
.fchip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chipgrid{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.bigshift{display:flex;align-items:center;gap:12px;border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);padding:12px 14px;border-radius:10px;margin:8px 0}
.bigshift b{font-size:22px}
.sw{display:flex;align-items:center;gap:10px;margin:6px 0;cursor:pointer}
.sw input{width:22px;height:22px;accent-color:var(--brand)}
.step b.n{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--brand-ink);align-items:center;justify-content:center;font-size:13px}
.step ol{padding-left:20px;margin:8px 0}
.thumb{max-width:100%;max-height:420px;border-radius:10px;border:1px solid var(--line);display:block;margin:10px 0}
details summary{cursor:pointer;color:var(--brand);font-weight:600;padding:6px 0}
.cmp{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0}
.person{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.person h4{margin:0 0 6px;font-size:15px}
.person .ln{display:flex;gap:8px;align-items:baseline;margin:3px 0}
.person .tag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px;flex:none}
.tag.out{background:var(--err-bg);color:var(--danger)}.tag.in{background:var(--ok-bg);color:var(--ok)}
.log{padding:12px 0;border-bottom:1px solid var(--line)}.log:last-child{border-bottom:0}
.log.undone{opacity:.55}
.floatbar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:7;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.floatbar .btn{min-height:38px;padding:7px 14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:88vw;display:none;text-align:center}
#toast.err{background:#b3261e}
.center{text-align:center;padding:30px 0;color:var(--muted)}
.sec{font-size:13px;color:var(--muted);font-weight:700;margin:20px 2px 4px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
/* ============ 設定 ============ */
const SKILLS = ['A','B','C','C+','G','V','OZ','NX','HX','BX','TR','T1','TG'];
const AI_LINKS = [{name:'ChatGPT',url:'https://chatgpt.com'},{name:'Claude',url:'https://claude.ai'},{name:'Gemini',url:'https://gemini.google.com'}];
const PROMPT = `你是班表轉換器。請讀取我附上的「月班表」截圖,只輸出下方格式的純文字(放在一個程式碼區塊內),不要任何解釋或多餘文字。

規則:
1. 只處理截圖中央標示的那個月份;灰色的上個月、下個月日期一律忽略。
2. 每個有班的格子都有「班別代碼」(例如 Hv、hL、hT)和「開始-結束時間」。
3. 班別代碼只要含有大寫 X、Y 或 Z,就是休假,請直接略過、不要輸出(例如 XC、HX、Yp、s/Z)。
4. 班別代碼的大小寫與符號必須和截圖完全一致。
5. 日期格式 YYYY-MM-DD;時間格式 HH:MM(24 小時制)。
6. 每種班別只在 #TYPES 列一次;#SHIFTS 每個上班日一行,依日期由小到大。
7. 看不清楚的格子,輸出「日期|?」,不要猜。

輸出格式:
#MONTH YYYY-MM
#TYPES
代碼|開始|結束
#SHIFTS
日期|代碼

格式範例(僅示範格式,內容請依截圖):
#MONTH 2026-11
#TYPES
Hv|05:00|13:30
hL|15:30|00:00
#SHIFTS
2026-11-01|hL
2026-11-24|Hv`;

/* ============ 資料(只存在這支手機的瀏覽器裡) ============ */
const KEY = 'myshift.local.v1';
const blank = () => ({v:1, profile:null, types:{}, shifts:{}, swaps:[]});
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d && d.v===1) return Object.assign(blank(), d); }catch(e){} return blank(); }
let D = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(D)); return true; }catch(e){ toast('儲存失敗:瀏覽器不允許儲存(是否為無痕模式?)', true); return false; } }
const draft = { get(){ try{ return JSON.parse(localStorage.getItem('myshift.draft'))||{} }catch(e){ return {} } }, set(v){ try{ localStorage.setItem('myshift.draft', JSON.stringify(v)) }catch(e){} } };

/* ============ 小工具 ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const WD = ['日','一','二','三','四','五','六'];
const nextMonth = k => { const [y,m]=k.split('-').map(Number); return m===12?`${y+1}-01`:`${y}-${pad(m+1)}`; };
const prevMonth = k => { const [y,m]=k.split('-').map(Number); return m===1?`${y-1}-12`:`${y}-${pad(m-1)}`; };
const fmtD = s => { const [y,m,d]=s.split('-').map(Number); return `${pad(m)}/${pad(d)}(${WD[new Date(y,m-1,d).getDay()]})`; };
const fmtAt = iso => new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',dateStyle:'short',timeStyle:'short'}).format(new Date(iso));
const isOff = c => /[XYZ]/.test(c);
const timeOf = code => { const t=D.types[code]; return t ? `${t.start}–${t.end}` : ''; };
const sortedTypes = () => Object.entries(D.types).sort((a,b)=>a[1].start.localeCompare(b[1].start)||a[0].localeCompare(b[0]));
const skillText = () => (D.profile&&D.profile.skills.length) ? D.profile.skills.join(' / ') : '未填';
let toastTimer;
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className=err?'err':''; t.style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display='none',err?4500:2400); }
const fail = e => { console.error(e); toast((e&&e.message)||String(e), true); };
function setupIcon(){ try{ const c=document.createElement('canvas'); c.width=c.height=180; const x=c.getContext('2d'); x.fillStyle='#0f766e'; x.fillRect(0,0,180,180); x.fillStyle='#fff'; x.font='bold 100px sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('班',90,98); $('#touchIcon').href=c.toDataURL('image/png'); }catch(e){} }
function colorOf(code, types=D.types){
  const t=types[code]; if(!t||!t.start) return 'var(--c-other)';
  const h=parseInt(t.start.slice(0,2),10);
  if(h>=4&&h<9) return 'var(--c-early)'; if(h>=9&&h<14) return 'var(--c-day)'; if(h>=14&&h<18) return 'var(--c-eve)'; return 'var(--c-night)';
}
function download(name, text, mime){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){
    try{ const ta=document.createElement('textarea'); ta.value=text; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.focus(); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok; }catch(e2){ return false; }
  }
}

/* ============ 狀態 ============ */
const S = { tab:'cal', page:null, month:ymd(new Date()).slice(0,7), logMonth:ymd(new Date()).slice(0,7),
  sel:null, afterImport:false, day:null, setup:null, sw:null,
  imp:{text:draft.get().text||'', img:null, imgName:'', parsed:null, copied:false} };

/* ============ 畫面骨架 ============ */
const ICON = {
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  log:'<svg viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>',
  me:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>'
};
function render(){
  if(!D.profile){ return renderSetup(true); }
  const body = S.page==='import' ? viewImport() : ({cal:viewCal,log:viewLog,me:viewMe})[S.tab]();
  const tabs=[['cal','月曆'],['log','換班紀錄'],['me','設定']];
  $('#app').innerHTML = `
  <div class="top"><div class="brand">我的班表</div><div class="who">${esc(D.profile.name)}<br>${esc(D.profile.id)}</div></div>
  <main>${body}</main>
  ${S.sel&&S.tab==='cal'&&!S.page?`<div class="floatbar"><span>已選 ${S.sel.size} 天</span><span class="row"><button class="btn ghost sm" style="color:#fff;border-color:#fff" data-act="selCancel">取消</button><button class="btn sm" data-act="selApply" ${S.sel.size?'':'disabled'}>新增特殊勤務</button></span></div>`:''}
  <nav class="tabs"><div class="in">${tabs.map(([k,l])=>`<button class="tab ${S.tab===k&&!S.page?'on':''}" data-act="tab" data-tab="${k}">${ICON[k]}${l}</button>`).join('')}</div></nav>`;
}

/* ============ 個人資料(含戰力複選) ============ */
function profileForm(first){
  const s=S.setup;
  return `<form class="card" data-form="profile" autocomplete="off">
    <label class="f" for="p_id" style="margin-top:0">人事代號</label><input type="text" id="p_id" autocapitalize="characters" value="${esc(s.id)}">
    <label class="f" for="p_name">姓名</label><input type="text" id="p_name" value="${esc(s.name)}">
    <label class="f">戰力(可複選)</label>
    <button type="button" class="select" data-act="pickSkills"><span>${s.skills.length?esc(SKILLS.filter(x=>s.skills.includes(x)).join(' / ')):'<span class="muted">點選選擇</span>'}</span><span>▾</span></button>
    <div class="msg err" id="pMsg"></div>
    <button class="btn block" style="margin-top:16px">${first?'開始使用':'儲存'}</button>
  </form>`;
}
function renderSetup(first){
  if(!S.setup) S.setup = D.profile ? {id:D.profile.id,name:D.profile.name,skills:[...D.profile.skills]} : {id:'',name:'',skills:[]};
  $('#app').innerHTML = `<div class="auth"><h1>我的班表</h1>
    <p class="muted">資料只存在你的手機,不會上傳,也不需要註冊。</p>${profileForm(true)}</div>`;
}
function skillSheet(){
  openSheet(`<h2>選擇戰力</h2><p class="muted small">可複選</p>
    <div class="chipgrid">${SKILLS.map(k=>`<button type="button" class="fchip ${S.setup.skills.includes(k)?'on':''}" data-act="skillToggle" data-s="${esc(k)}">${esc(k)}</button>`).join('')}</div>
    <button class="btn block" data-act="skillDone">完成</button>`);
}
function submitProfile(){
  const id=$('#p_id').value.trim().toUpperCase(), name=$('#p_name').value.trim();
  const m=$('#pMsg'); const err=t=>{m.textContent=t;m.className='msg err show';};
  if(!id) return err('請填人事代號'); if(!name) return err('請填姓名');
  D.profile={id,name,skills:SKILLS.filter(k=>S.setup.skills.includes(k))};
  if(!save()) return; S.setup=null; toast('已儲存'); render();
}

/* ============ 月曆 ============ */
function monthGrid(k, cell){
  const [y,m]=k.split('-').map(Number); const first=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate(), today=todayStr();
  let h='<div class="grid">'+WD.map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<first;i++) h+='<div class="cell empty"></div>';
  for(let d=1;d<=days;d++){ const ds=`${k}-${pad(d)}`; h+=cell(ds,d,ds===today); }
  return h+'</div>';
}
const chipHTML = (code, types, start) => `<span class="chip" style="--c:${colorOf(code,types)}">${esc(code)}${start?`<small>${esc(start)}</small>`:''}</span>`;
function viewCal(){
  const [y,m]=S.month.split('-').map(Number);
  const count=Object.keys(D.shifts).filter(k=>k.startsWith(S.month)).length;
  const duties=Object.entries(D.shifts).filter(([k,v])=>k.startsWith(S.month)&&(v.duty||v.note));
  return `

function renderDay(){

function saveDay(){

/* ============ 換班 ============ */
function swapStart(){
  const s=D.shifts[S.day];
  S.sw={d1:S.day,c1:s.code,partner:'',d2:S.day,code:'',note:'',newCode:'',newStart:'',newEnd:'',step:1};

}
function typeSelect(sel){
  return `<select id="sw_code"><option value="">請選擇班別</option>${sortedTypes().map(([c,t])=>`<option value="${esc(c)}" ${sel===c?'selected':''}>${esc(c)}  ${t.start}–${t.end}</option>`).join('')}<option value="__new__" ${sel==='__new__'?'selected':''}>＋ 新增其他班別…</option></select>`;
}
function renderSwap(){
  const w=S.sw; const m=D.shifts[w.d1];
  if(w.step===1){
    openSheet(`<h2>換班</h2>
    <div class="bigshift" style="--c:${colorOf(m.code)}"><div><div class="small muted">我要換出的班</div><b>${fmtD(w.d1)} ${esc(m.code)}</b> <span>${esc(timeOf(m.code))}</span></div></div>

    <label class="f">對方給我的班</label>
    <div class="row" style="flex-wrap:nowrap"><div style="flex:1.2"><div class="small muted">日期</div><input type="date" id="sw_d2" value="${esc(w.d2)}"></div>

    ${w.code==='__new__'?`<div class="card flat" style="margin-top:10px"><div class="small muted">新增班別</div>
      <input type="text" id="sw_newCode" placeholder="班別代碼,例如 Hv" value="${esc(w.newCode)}" style="margin:6px 0">
      <div class="row" style="flex-wrap:nowrap"><input type="time" id="sw_newStart" value="${esc(w.newStart)}"><span>–</span><input type="time" id="sw_newEnd" value="${esc(w.newEnd)}"></div></div>`:''}
    <label class="f" for="sw_note">對方這個班的特殊勤務 / 備註(選填,會跟著這個班記在你的班表)</label>

  } else {

    openSheet(`<h2>確認換班</h2>

        <div class="ln"><span class="tag in">換入</span><span><b>${fmtD(w.d2)} ${esc(cmp.code)}</b> ${esc(cmp.time)}</span></div></div>
      <div class="person"><h4>對方(${esc(w.partner.trim())})</h4>
        <div class="ln"><span class="tag out">換出</span><span><b>${fmtD(w.d2)} ${esc(cmp.code)}</b> ${esc(cmp.time)}</span></div>
        <div class="ln"><span class="tag in">換入</span><span><b>${fmtD(w.d1)} ${esc(w.c1)}</b> ${esc(timeOf(w.c1))}</span></div></div>
    </div>
    <div class="card flat"><div class="small muted">換完後你的班表</div>
      ${w.d1===w.d2?`<div>${fmtD(w.d1)}:<b>${esc(cmp.code)}</b> ${esc(cmp.time)}</div>`:`<div>${fmtD(w.d1)}:<b>休假</b></div><div>${fmtD(w.d2)}:<b>${esc(cmp.code)}</b> ${esc(cmp.time)}</div>`}</div>
    ${(D.shifts[w.d1].duty||D.shifts[w.d1].note)?`<div class="warnbox">${D.shifts[w.d1].duty?'★ 這個班有特殊勤務,會一併交給對方:\n':'✎ 這個班的備註,會一併交給對方:\n'}${esc(D.shifts[w.d1].note||'(未填備註)')}</div>`:''}
    ${w.note.trim()?`<div class="warnbox">對方的班備註:\n${esc(w.note.trim())}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" data-act="swapConfirm">確認換班</button><button class="btn ghost" data-act="swapBack">上一步</button></div>
    <button class="link" data-act="copySwap">複製明細(貼給對方 / LINE)</button>`);

function swapCompare(w){
  const code = w.code==='__new__' ? w.newCode.trim() : w.code;
  const time = w.code==='__new__' ? `${w.newStart}–${w.newEnd}` : timeOf(code);
  return {code,time};
}
function swapNext(){
  const w=S.sw, m=D.shifts[w.d1]; const box=$('#swMsg'); const err=t=>{box.textContent=t;box.className='msg err show';};
  w.partner=$('#sw_partner').value; w.d2=$('#sw_d2').value||w.d1; w.code=$('#sw_code').value; w.note=$('#sw_note').value;
  if(w.code==='__new__'){ w.newCode=$('#sw_newCode').value; w.newStart=$('#sw_newStart').value; w.newEnd=$('#sw_newEnd').value; }
  if(!w.partner.trim()) return err('請輸入換班對象');
  if(!w.code) return err('請選擇對方給你的班別');
  const c=swapCompare(w);
  if(w.code==='__new__'){ if(!c.code) return err('請輸入新班別代碼'); if(!w.newStart||!w.newEnd) return err('請輸入新班別的開始與結束時間'); }
  if(w.d2===w.d1 && c.code===m.code) return err('兩邊是同一個班,不需要換');
  if(w.d2!==w.d1 && D.shifts[w.d2]) return err(`你 ${fmtD(w.d2)} 已經有班(${D.shifts[w.d2].code}),不能再換入一個班`);
  if(isOff(c.code)) return err('這是休假類班別(含 X/Y/Z),請確認班別');
  const warns=[];
  if(m.duty||m.note) warns.push(`你要換出的 ${fmtD(w.d1)} ${m.code} ${m.duty?'有特殊勤務':'有備註'}:\n${m.note||'(未填備註)'}\n→ 需要一併交接給對方。`);
  if(w.note.trim()) warns.push(`對方的 ${fmtD(w.d2)} ${c.code} 有特殊勤務/備註:\n${w.note.trim()}\n→ 換入後你需要接手。`);
  const go=()=>{ w.step=2; renderSwap(); };
  if(warns.length){
    S.pendingGo=go;
    showModal(`<h3>⚠ 這個班有特殊勤務</h3>${warns.map(t=>`<div class="warnbox">${esc(t)}</div>`).join('')}
      <p><b>請注意雙方戰力是否符合這個班的需求。</b><br><span class="muted small">你的戰力:${esc(skillText())}</span></p>
      <button class="btn block" data-act="modalGo">我知道了,繼續</button><button class="link" style="width:100%" data-act="modalCancel">返回修改</button>`);
  } else go();
}
function swapText(w, cmp){
  const m=D.profile;
  return `【換班明細】\n${m.name}(${m.id}) ⇄ ${w.partner.trim()}\n\n我換出:${fmtD(w.d1)} ${w.c1} ${timeOf(w.c1)}\n我換入:${fmtD(w.d2)} ${cmp.code} ${cmp.time}\n\n對方換出:${fmtD(w.d2)} ${cmp.code} ${cmp.time}\n對方換入:${fmtD(w.d1)} ${w.c1} ${timeOf(w.c1)}`
    + (w.note1?`\n\n特殊勤務/備註(隨 ${w.c1} 交接):${w.note1}`:'') + (w.note.trim()?`\n\n特殊勤務/備註(隨 ${cmp.code}):${w.note.trim()}`:'');
}
function swapConfirm(){
  const w=S.sw, cmp=swapCompare(w); const mine=D.shifts[w.d1];
  if(!mine) return toast('這天的班已不存在',true);
  if(w.code==='__new__') D.types[cmp.code]={start:w.newStart,end:w.newEnd};
  const before={}; before[w.d1]=JSON.parse(JSON.stringify(D.shifts[w.d1]||null)); before[w.d2]=JSON.parse(JSON.stringify(D.shifts[w.d2]||null));
  const incoming={code:cmp.code,duty:!!w.note.trim(),note:w.note.trim()};
  if(w.d1===w.d2) D.shifts[w.d1]=incoming; else { delete D.shifts[w.d1]; D.shifts[w.d2]=incoming; }
  const entry={id:Date.now().toString(36),at:new Date().toISOString(),partner:w.partner.trim(),d1:w.d1,c1:mine.code,t1:timeOf(mine.code),d2:w.d2,c2:cmp.code,t2:cmp.time,
    note1:mine.note||'',duty1:!!mine.duty,note2:w.note.trim(),before,status:'done'};
  D.swaps.push(entry);
  if(!save()) return;
  closeSheet(); toast('已換班,班表已更新'); S.month=w.d2.slice(0,7)===S.month?S.month:S.month; render();
}

    <div class="row" style="margin-top:6px"><button class="link" data-act="copyLog" data-id="${w.id}">複製明細</button>${lastDone&&lastDone.id===w.id?`<button class="link" style="color:var(--danger)" data-act="undoSwap" data-id="${w.id}">復原這筆</button>`:''}</div></div>`).join(''):'<span class="muted">這個月沒有換班紀錄</span>'}</div>

function copyLog(id){ const w=D.swaps.find(x=>x.id===id); const cmp={code:w.c2,time:w.t2}; copyText(swapText({d1:w.d1,c1:w.c1,d2:w.d2,partner:w.partner,note:w.note2},cmp).replace(/\n\n特殊勤務\/備註\(隨 [^)]*\):[^\n]*$/,'')).then(ok=>toast(ok?'已複製':'複製失敗',!ok)); }
function undoSwap(id){
  const w=D.swaps.find(x=>x.id===id); if(!w) return;
  if(!confirm(`復原這筆換班?\n班表會回到換班前的狀態(${fmtD(w.d1)} ${w.c1})。`)) return;
  Object.entries(w.before).forEach(([ds,v])=>{ if(v) D.shifts[ds]=v; else delete D.shifts[ds]; });
  w.status='undone'; w.undoneAt=new Date().toISOString();
  if(save()){ toast('已復原'); render(); }
}
function exportCsv(){
  const rows=[['序號','換班時間','對象','我換出日期','我換出班別','我換出時間','我換入日期','我換入班別','我換入時間','交出的備註','換入的備註','狀態']];
  monthSwaps().forEach((w,i)=>rows.push([i+1,fmtAt(w.at),w.partner,w.d1,w.c1,w.t1,w.d2,w.c2,w.t2,w.note1,w.note2,w.status==='undone'?'已復原':'已完成']));
  download(`換班紀錄_${D.profile.id}_${S.logMonth}.csv`,'﻿'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\r\n'),'text/csv;charset=utf-8');

function restore(file){
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||d.v!==1||typeof d.shifts!=='object'||!Array.isArray(d.swaps)) throw new Error('這不是有效的備份檔');
      if(!confirm('還原會覆蓋目前這支手機上的所有資料,確定?')) return; D=Object.assign(blank(),d); if(save()){ S.setup=null; toast('已還原'); render(); } }catch(e){ fail(e); } };

}

/* ============ 匯入班表 ============ */
function parseSchedule(raw){
  const out={month:null,types:{},shifts:[],off:0,errors:[],warns:[]}; const seen=new Set(); let sec=null;
  const lines=String(raw).replace(/[｜│¦]/g,'|').replace(/：/g,':').replace(/[–—~～]/g,'-').split(/\r?\n/);
  const nt=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec((t||'').trim()); return m&&+m[1]<=24&&+m[2]<60?`${pad(+m[1]%24)}:${m[2]}`:null;};
  for(let ln of lines){
    ln=ln.trim().replace(/^[-*•]\s+/,''); if(!ln||/^```/.test(ln)) continue; let m;
    if((m=ln.match(/^#\s*MONTH\s*:?\s*(\d{4})\s*-\s*(\d{1,2})/i))){ out.month=`${m[1]}-${pad(+m[2])}`; sec=null; continue; }
    if(/^#\s*TYPES/i.test(ln)){ sec='t'; continue; } if(/^#\s*SHIFTS/i.test(ln)){ sec='s'; continue; } if(ln.startsWith('#')) continue;
    const p=ln.split('|').map(x=>x.trim());
    if(sec==='t'){
      if(p[0]==='代碼') continue; if(p.length<3){ out.warns.push(`略過無法解讀的班別行:${ln}`); continue; }
      const st=nt(p[1]), en=nt(p[2]); if(!st||!en){ out.errors.push(`班別 ${p[0]} 的時間格式不對:${p[1]}|${p[2]}`); continue; }
      if(!isOff(p[0])) out.types[p[0]]={start:st,end:en};
    } else if(sec==='s'){
      if(p[0]==='日期') continue; if(p.length<2){ out.warns.push(`略過無法解讀的行:${ln}`); continue; }
      const dm=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(p[0]); if(!dm){ out.errors.push(`日期格式不對:${p[0]}`); continue; }
      const ds=`${dm[1]}-${pad(+dm[2])}-${pad(+dm[3])}`; if(new Date(+dm[1],+dm[2]-1,+dm[3]).getMonth()!==+dm[2]-1){ out.errors.push(`不存在的日期:${ds}`); continue; }
      const code=p[1]; if(!code||code==='?'){ out.errors.push(`${ds} 的班別 AI 看不清楚,請對照截圖手動補上`); continue; }
      if(isOff(code)){ out.off++; continue; } if(seen.has(ds)){ out.errors.push(`${ds} 出現兩次`); continue; }
      seen.add(ds); out.shifts.push({date:ds,code});
    }
  }
  if(!out.shifts.length && !out.errors.length) out.errors.push('沒有解析到任何上班日,請確認貼上的是 AI 的完整輸出');
  if(!out.month && out.shifts.length) out.month=out.shifts[0].date.slice(0,7);
  out.shifts.forEach(s=>{ if(out.month&&!s.date.startsWith(out.month)) out.errors.push(`${s.date} 不在 ${out.month} 內`); if(!(s.code in out.types)) out.errors.push(`班別 ${s.code} 沒有時間資料(#TYPES 缺少)`); });
  out.errors=[...new Set(out.errors)]; out.shifts.sort((a,b)=>a.date.localeCompare(b.date)); return out;
}
function viewImport(){
  const I=S.imp;
  return `<div><button class="link" data-act="closeImport">‹ 返回</button></div>
  <h2>匯入班表</h2>
  <p class="muted">辨識交給你自己的 AI(ChatGPT、Claude、Gemini 皆可),這裡不需要上傳截圖。</p>

  <section class="card step"><h3><b class="n">1</b>複製提示詞</h3>
    <button class="btn block" data-act="copyPrompt" id="copyBtn">${I.copied?'已複製 ✓ 再複製一次':'複製提示詞'}</button>
    <details><summary>查看提示詞內容</summary><textarea readonly class="mono" style="min-height:260px" id="promptBox">${esc(PROMPT)}</textarea></details></section>

  <section class="card step"><h3><b class="n">2</b>打開 AI,上傳截圖、貼上提示詞</h3>
    <ol><li>點下方連結打開 AI</li><li><b>上傳</b>你的月班表截圖</li><li><b>貼上</b>剛複製的提示詞,送出</li><li>等 AI 回覆後,按它的「複製」鈕,複製整段結果</li><li>回到這個頁面,貼在下一步</li></ol>
    <div class="row">${AI_LINKS.map(a=>`<a class="btn ghost sm" href="${a.url}" target="_blank" rel="noopener">${a.name} ↗</a>`).join('')}</div></section>

  <section class="card step"><h3><b class="n">3</b>貼上 AI 的結果</h3>
    <textarea id="impText" class="mono" placeholder="#MONTH 2026-11&#10;#TYPES&#10;…&#10;#SHIFTS&#10;…">${esc(I.text)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn ghost" data-act="pasteClip">從剪貼簿貼上</button><button class="btn" data-act="previewImp">預覽月曆</button></div>
    ${I.parsed?impPreview(I.parsed):''}</section>`;
}
function impPreview(P){
  const ok=!P.errors.length && P.shifts.length; const map=new Map(P.shifts.map(s=>[s.date,s.code])); const [y,m]=(P.month||'').split('-').map(Number);
  return `<div style="margin-top:16px" id="impPrev">
    ${P.errors.length?`<div class="msg err show"><b>需要修正:</b><ul style="margin:6px 0 0;padding-left:18px">${P.errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul><div style="margin-top:6px">可直接修改上方文字後再按「預覽月曆」</div></div>`:''}
    ${P.warns.length?`<div class="msg warn show"><ul style="margin:0;padding-left:18px">${P.warns.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:''}
    ${P.month&&P.shifts.length?`<p style="margin-top:14px"><b>${y} 年 ${m} 月</b> · 上班 <b>${P.shifts.length}</b> 天 · 略過休假 ${P.off} 天</p>
    <div class="msg warn show" style="margin:6px 0 10px">請對照你的班表截圖,逐天確認班別與時間無誤(空白 = 休假)。</div>
    ${monthGrid(P.month,(ds,d)=>{const c=map.get(ds);return `<div class="cell static"><span class="dn">${d}</span>${c?chipHTML(c,P.types,(P.types[c]||{}).start):''}</div>`;})}
    <table style="margin-top:10px"><tr><th>班別</th><th>時間</th></tr>${[...new Set(P.shifts.map(s=>s.code))].map(c=>`<tr><td>${esc(c)}</td><td>${esc((P.types[c]||{}).start)}–${esc((P.types[c]||{}).end)}</td></tr>`).join('')}</table>
    <div class="sec">用截圖對照(只在手機上顯示)</div>
    <input type="file" id="imgPick" accept="image/*" hidden><label for="imgPick" class="btn ghost sm">${S.imp.img?'換一張截圖':'選擇班表截圖來對照'}</label>
    ${S.imp.img?`<img class="thumb" src="${S.imp.img}" alt="班表截圖">`:''}`:''}
    <button class="btn block" style="margin-top:14px" data-act="confirmImp" ${ok?'':'disabled'}>確認無誤,匯入</button>
    <p class="muted small">會覆蓋你這個月的班表;已填的備註會保留。匯入後,請再為固定的特殊勤務加上標記。</p></div>`;
}
function confirmImport(){
  const P=S.imp.parsed; if(!P||P.errors.length) return;
  const n=D.swaps.filter(w=>w.status==='done'&&(w.d1.startsWith(P.month)||w.d2.startsWith(P.month))).length;
  if(n && !confirm(`這個月已有 ${n} 筆換班紀錄。重新匯入會用截圖覆蓋目前班表(紀錄會保留)。確定?`)) return;
  const next={}; Object.entries(D.shifts).forEach(([k,v])=>{ if(!k.startsWith(P.month)) next[k]=v; });
  P.shifts.forEach(s=>{ const prev=D.shifts[s.date]; next[s.date]={code:s.code,duty:!!(prev&&prev.duty),note:(prev&&prev.note)||''}; });
  D.shifts=next; Object.entries(P.types).forEach(([c,t])=>{ D.types[c]=t; });
  if(!save()) return;
  toast(`已匯入 ${P.shifts.length} 天`); S.imp.text=''; S.imp.parsed=null; S.imp.img&&URL.revokeObjectURL(S.imp.img); S.imp.img=null; draft.set({});
  S.month=P.month; S.page=null; S.tab='cal'; S.afterImport=true; render(); window.scrollTo(0,0);
}

/* ============ 事件 ============ */
const H = {
  tab:b=>{ S.tab=b.dataset.tab; S.page=null; S.sel=null; if(S.tab==='me') S.setup=null; render(); window.scrollTo(0,0); },
  monthPrev:()=>{ S.month=prevMonth(S.month); render(); }, monthNext:()=>{ S.month=nextMonth(S.month); render(); },
  logPrev:()=>{ S.logMonth=prevMonth(S.logMonth); render(); }, logNext:()=>{ S.logMonth=nextMonth(S.logMonth); render(); },
  cellTap:b=>{ const ds=b.dataset.date; if(S.sel){ if(!D.shifts[ds]) return; S.sel.has(ds)?S.sel.delete(ds):S.sel.add(ds); render(); } else { S.day=ds; renderDay(); } },
  selStart:()=>{ S.sel=new Set(); S.afterImport=false; render(); }, selCancel:()=>{ S.sel=null; render(); },
  dismissAfter:()=>{ S.afterImport=false; render(); },
  selApply:()=>{ const days=[...S.sel].sort(); openSheet(`<h2>新增特殊勤務</h2><p class="muted">套用到 ${days.length} 天:${days.map(fmtD).join('、')}</p>
    <label class="f" for="batchNote">備註(自由填寫)</label><textarea id="batchNote" placeholder="例如:固定勤務內容、搭檔、注意事項…"></textarea>
    <p class="muted small">這些日子會標上 ★,備註會顯示在各班的詳細內容。已有的備註會被這段取代。</p>
    <div class="row" style="margin-top:10px"><button class="btn" data-act="batchSave">儲存</button><button class="btn ghost" data-act="closeSheet">返回</button></div>`); },
  batchSave:()=>{ const note=$('#batchNote').value.trim(); [...S.sel].forEach(ds=>{ if(D.shifts[ds]){ D.shifts[ds].duty=true; D.shifts[ds].note=note; } }); if(save()){ const n=S.sel.size; S.sel=null; closeSheet(); toast(`已標記 ${n} 天`); render(); } },
  closeSheet:()=>closeSheet(),
  saveDay:()=>saveDay(), fixDay:()=>fixDay(),
  swapStart:()=>swapStart(), swapNext:()=>swapNext(), swapBack:()=>{ S.sw.step=1; renderSwap(); }, swapConfirm:()=>swapConfirm(),
  copySwap:async()=>{ const w=S.sw; const ok=await copyText(swapText({...w,note1:(D.shifts[w.d1]||{}).note||''},swapCompare(w))); toast(ok?'已複製明細':'複製失敗',!ok); },
  modalGo:()=>{ closeModal(); const g=S.pendingGo; S.pendingGo=null; g&&g(); }, modalCancel:()=>{ closeModal(); S.pendingGo=null; },
  copyLog:b=>copyLog(b.dataset.id), undoSwap:b=>undoSwap(b.dataset.id), exportCsv:()=>exportCsv(),
  pickSkills:()=>{ if($('#p_id')){ S.setup.id=$('#p_id').value; S.setup.name=$('#p_name').value; } skillSheet(); },
  skillToggle:b=>{ const k=b.dataset.s, a=S.setup.skills; const i=a.indexOf(k); i>=0?a.splice(i,1):a.push(k); skillSheet(); },
  skillDone:()=>{ closeSheet(); if(D.profile&&S.tab!=='me'&&!S.page&&false){} S.page!=='import'&&renderProfileArea(); },
  backup:()=>backup(),
  wipe:()=>{ if(confirm('清除這支手機上的所有班表、紀錄與個人資料?此動作無法復原(建議先匯出備份)。')&&confirm('再確認一次:真的要全部清除?')){ D=blank(); save(); S.setup=null; S.sel=null; render(); } },
  openImport:()=>{ S.page='import'; S.sel=null; closeSheet(); render(); window.scrollTo(0,0); },
  closeImport:()=>{ S.page=null; render(); },
  copyPrompt:async b=>{ const ok=await copyText(PROMPT); if(ok){ S.imp.copied=true; b.textContent='已複製 ✓ 再複製一次'; toast('提示詞已複製,去貼給 AI 吧'); } else { toast('自動複製失敗,請展開「查看提示詞內容」手動全選複製',true); const d=document.querySelector('details'); if(d){d.open=true; const t=$('#promptBox'); t&&t.select();} } },
  pasteClip:async()=>{ try{ const t=await navigator.clipboard.readText(); if(!t) return toast('剪貼簿是空的',true); S.imp.text=t; draft.set({text:t}); S.imp.parsed=parseSchedule(t); render(); scrollPrev(); }catch(e){ toast('無法讀取剪貼簿,請長按文字框手動貼上',true); } },
  previewImp:()=>{ S.imp.text=$('#impText').value; draft.set({text:S.imp.text}); S.imp.parsed=parseSchedule(S.imp.text); render(); scrollPrev(); },
  confirmImp:()=>confirmImport()
};
function renderProfileArea(){ if(!D.profile) renderSetup(true); else render(); }
function scrollPrev(){ const el=$('#impPrev'); el&&el.scrollIntoView({behavior:'smooth',block:'start'}); }
document.addEventListener('click',e=>{ const a=e.target.closest('[data-act]'); if(!a) return; const f=H[a.dataset.act]; if(f){ e.preventDefault(); Promise.resolve(f(a,e)).catch(fail); } });
document.addEventListener('submit',e=>{ const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault(); submitProfile(); });
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='p_id') S.setup.id=e.target.value; else if(id==='p_name') S.setup.name=e.target.value;
  else if(id==='impText'){ S.imp.text=e.target.value; draft.set({text:S.imp.text}); }
  else if(S.sw && id && id.startsWith('sw_')){ const k={sw_partner:'partner',sw_d2:'d2',sw_note:'note',sw_newCode:'newCode',sw_newStart:'newStart',sw_newEnd:'newEnd'}[id]; if(k) S.sw[k]=e.target.value; }
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='sw_code' && S.sw){ S.sw.partner=$('#sw_partner').value; S.sw.d2=$('#sw_d2').value||S.sw.d1; S.sw.note=$('#sw_note').value; S.sw.code=e.target.value; renderSwap(); }
  else if(id==='imgPick' && e.target.files[0]){ const f=e.target.files[0]; if(S.imp.img) URL.revokeObjectURL(S.imp.img); S.imp.img=URL.createObjectURL(f); S.imp.imgName=f.name; const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(id==='restorePick' && e.target.files[0]){ restore(e.target.files[0]); e.target.value=''; }
});

setupIcon();
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
render();
</script>
