<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="換班">
<meta name="theme-color" content="#0f766e">
<meta name="color-scheme" content="light dark">
<title>換班系統</title>
<link rel="apple-touch-icon" id="touchIcon" href="data:,">
<style>
:root{
  --bg:#f3f6f5;--card:#fff;--ink:#14201e;--muted:#667674;--line:#e0e8e6;
  --brand:#0f766e;--brand-ink:#fff;--soft:#e5f3f0;--danger:#c0392b;--warn:#a8680f;--warn-bg:#fdf3e1;--err-bg:#fdeceb;
  --c-early:#0f9d8a;--c-day:#e8833a;--c-eve:#4f6bed;--c-night:#8b5cc7;--c-other:#8a9794;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(15,60,55,.07);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1413;--card:#152120;--ink:#e8f1ef;--muted:#8da19e;--line:#243430;
    --brand:#35b8a8;--brand-ink:#04211e;--soft:#16302c;--danger:#ff8070;--warn:#e3b45c;--warn-bg:#2b2410;--err-bg:#331a17;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));min-height:100vh}
#app{max-width:640px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
h2{font-size:22px;margin:8px 0 6px;letter-spacing:.2px}
h3{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:18px;letter-spacing:.5px}
.who{font-size:13px;color:var(--muted);text-align:right;line-height:1.3}
main{padding:14px 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--brand);color:var(--brand-ink);padding:11px 18px;border-radius:11px;font-weight:600;cursor:pointer;text-decoration:none;min-height:44px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{background:none;border:0;color:var(--brand);padding:6px 0;cursor:pointer;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
label.f{display:block;margin:12px 0 4px;font-size:14px;color:var(--muted)}
input[type=text],input[type=password],textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);outline:none}
input:focus,textarea:focus{border-color:var(--brand)}
textarea{min-height:150px;resize:vertical;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px;display:none}
.msg.show{display:block}
.msg.err{background:var(--err-bg);color:var(--danger)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.auth{padding:calc(40px + env(safe-area-inset-top)) 20px 30px}
.auth h1{font-size:28px;margin:0 0 4px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs .in{display:flex;width:100%;max-width:640px}
.tab{flex:1;background:none;border:0;padding:9px 0 8px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--brand);font-weight:700}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--danger);color:#fff;border-radius:10px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px;font-weight:700}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mhead .t{font-size:20px;font-weight:700}
.nav{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cell{position:relative;min-height:62px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:4px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink);overflow:hidden}
.cell.empty{border:0;background:none;cursor:default}
.cell.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cell .dn{font-size:13px;font-weight:600;color:var(--muted)}
.cell.today .dn{color:var(--brand)}
.cell.static{cursor:default}
.chip{display:flex;flex-direction:column;align-items:center;line-height:1.15;border-top:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:5px;padding:2px 3px;width:calc(100% - 6px);font-weight:700;font-size:13px}
.chip small{font-size:10px;font-weight:500;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:10px 2px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.empty-card{text-align:center;padding:22px 16px}
.pill{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--soft);color:var(--brand)}
.pill.gray{background:var(--bg);color:var(--muted)}
.pill.ok{background:#dff5e8;color:#17743d}.pill.no{background:var(--err-bg);color:var(--danger)}.pill.wait{background:var(--warn-bg);color:var(--warn)}
@media (prefers-color-scheme:dark){.pill.ok{background:#12301f;color:#6fdca0}}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;z-index:21;padding:8px 18px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.fchip{border:1.5px solid var(--line);background:none;border-radius:20px;padding:5px 13px;font-size:14px;white-space:nowrap;cursor:pointer}
.fchip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.grp{margin:14px 0 4px;display:flex;align-items:center;gap:8px;font-weight:700}
.grp .bar{width:4px;height:18px;border-radius:2px;background:var(--c)}
.grp small{font-weight:500;color:var(--muted)}
.person{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person .nm{font-weight:600}
.person.me{background:var(--soft);margin:0 -8px;padding:9px 8px;border-radius:9px;border-bottom:0}
.opt{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;margin:8px 0;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--brand)}
.opt:has(input:checked){border-color:var(--brand);background:var(--soft)}
.step h3 b{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--brand-ink);align-items:center;justify-content:center;font-size:13px}
.step ol{padding-left:20px;margin:8px 0}
.thumb{max-width:100%;max-height:220px;border-radius:10px;border:1px solid var(--line);display:block;margin:10px 0}
details summary{cursor:pointer;color:var(--brand);font-weight:600;padding:6px 0}
.req{padding:12px 0;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
.sec{font-size:13px;color:var(--muted);font-weight:700;margin:20px 2px 4px;letter-spacing:.5px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:88vw;display:none;text-align:center}
#toast.err{background:#b3261e}
.center{text-align:center;padding:40px 0;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ============ 設定 ============ */
const SUPABASE_URL = 'https://pewgskfbgtgvuotvumhc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WPIVoFWQyFHMzojjXP3uTg_2M4DLNFj'; // 公開金鑰,可放前端
const AUTH_DOMAIN  = 'evaair.com'; // 只是內部帳號標籤:人事代號@此網域。系統不會寄任何信
const AI_LINKS = [
  {name:'ChatGPT', url:'https://chatgpt.com'},
  {name:'Claude',  url:'https://claude.ai'},
  {name:'Gemini',  url:'https://gemini.google.com'}
];
const PROMPT = `你是班表轉換器。請讀取我附上的「月班表」截圖,只輸出下方格式的純文字(放在一個程式碼區塊內),不要任何解釋或多餘文字。

規則:
1. 只處理截圖中央標示的那個月份;灰色的上個月、下個月日期一律忽略。
2. 每個有班的格子都有「班別代碼」(例如 Hv、hL、hT)和「開始-結束時間」。
3. 班別代碼只要含有大寫 X、Y 或 Z,就是休假,請直接略過、不要輸出(例如 XC、HX、Yp、s/Z)。
4. 班別代碼的大小寫與符號必須和截圖完全一致。
5. 日期格式 YYYY-MM-DD;時間格式 HH:MM(24 小時制)。
6. 每種班別只在 #TYPES 列一次;#SHIFTS 每個上班日一行,依日期由小到大。
7. 看不清楚的格子,輸出「日期|?」,不要猜。

輸出格式:
#MONTH YYYY-MM
#TYPES
代碼|開始|結束
#SHIFTS
日期|代碼

格式範例(僅示範格式,內容請依截圖):
#MONTH 2026-11
#TYPES
Hv|05:00|13:30
hL|15:30|00:00
#SHIFTS
2026-11-01|hL
2026-11-24|Hv`;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true,autoRefreshToken:true}});

/* ============ 小工具 ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const WD = ['日','一','二','三','四','五','六'];
const hhmm = t => t ? String(t).slice(0,5) : '';
const nextMonth = k => { const [y,m]=k.split('-').map(Number); return m===12?`${y+1}-01`:`${y}-${pad(m+1)}`; };
const prevMonth = k => { const [y,m]=k.split('-').map(Number); return m===1?`${y-1}-12`:`${y}-${pad(m-1)}`; };
const fmtD = s => { const [y,m,d]=s.split('-').map(Number); return `${pad(m)}/${pad(d)}(${WD[new Date(y,m-1,d).getDay()]})`; };
const fmtTime = iso => new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',dateStyle:'short',timeStyle:'short'}).format(new Date(iso));
const isOff = c => /[XYZ]/.test(c);
const normId = s => String(s||'').trim().toUpperCase();
const emailOf = id => `${id.toLowerCase()}@${AUTH_DOMAIN}`;
const store = { get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };

let toastTimer;
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className=err?'err':''; t.style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display='none',err?4500:2400); }
const fail = e => { console.error(e); toast((e && e.message) || String(e), true); };

function setupIcon(){
  try{ const c=document.createElement('canvas'); c.width=c.height=180; const x=c.getContext('2d');
    x.fillStyle='#0f766e'; x.fillRect(0,0,180,180); x.fillStyle='#fff'; x.font='bold 100px sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('換',90,98);
    $('#touchIcon').href=c.toDataURL('image/png'); }catch(e){}
}

/* ============ 狀態 ============ */
const S = {
  me:null, staff:new Map(), types:new Map(),
  tab:'cal', page:null, month:(()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}`})(),
  myMonth:new Map(), monthLoaded:null,
  reqs:[], pendingIn:0, logs:[], logMonth:null, lastLoad:0,
  day:null, loading:false,
  imp:Object.assign({img:null,imgName:'',text:'',revealed:false,parsed:null,copied:false}, store.get('imp')||{}, {img:null,imgName:'',parsed:null,copied:false})
};
S.logMonth = S.month;
const colorOf = (code, types=S.types) => {
  const t = types.get(code); const raw = t && (t.start_time ?? t.start); if(!raw) return 'var(--c-other)';
  const h = parseInt(String(raw).slice(0,2),10);
  if(h>=4 && h<9) return 'var(--c-early)'; if(h>=9 && h<14) return 'var(--c-day)'; if(h>=14 && h<18) return 'var(--c-eve)'; return 'var(--c-night)';
};
const rangeOf = code => { const t=S.types.get(code); return t ? `${hhmm(t.start_time)}–${hhmm(t.end_time)}` : ''; };
const nameOf = emp => (S.staff.get(emp)||{}).name || emp;

/* ============ 資料載入 ============ */
async function loadRefs(){
  const [st,ty] = await Promise.all([
    sb.from('staff').select('employee_id,name,skill_level'),
    sb.from('shift_types').select('code,start_time,end_time')
  ]);
  if(st.error) throw st.error; if(ty.error) throw ty.error;
  S.staff = new Map(st.data.map(r=>[r.employee_id,r]));
  S.types = new Map(ty.data.map(r=>[r.code,r]));
}
async function loadMonth(){
  const k=S.month;
  const {data,error} = await sb.from('shifts').select('id,work_date,shift_code').eq('employee_id',S.me.employee_id).gte('work_date',k+'-01').lt('work_date',nextMonth(k)+'-01');
  if(error) throw error;
  if(k!==S.month) return;
  S.myMonth = new Map(data.map(r=>[r.work_date,r])); S.monthLoaded=k;
}
async function loadSwaps(){
  const {data,error} = await sb.from('swap_requests').select('*').order('created_at',{ascending:false}).limit(200);
  if(error) throw error;
  const me=S.me.employee_id;
  S.reqs = data.filter(r=>r.requester===me || r.target===me);
  S.pendingIn = S.reqs.filter(r=>r.target===me && r.status==='pending').length;
}
async function loadLogs(){
  const {data,error} = await sb.from('swap_logs').select('*').order('swapped_at',{ascending:false}).limit(1000);
  if(error) throw error;
  const me=S.me.employee_id;
  S.logs = data.filter(r=>r.a_emp===me || r.b_emp===me);
}
async function refreshAll(){
  try{ await loadRefs(); await Promise.all([loadMonth(),loadSwaps(),loadLogs()]); S.lastLoad=Date.now(); renderMain(); }
  catch(e){ fail(e); renderMain(); }
}

/* ============ 登入 / 註冊 ============ */
function renderAuth(mode, note){
  S.view='auth'; S.authMode=mode;
  const reg = mode==='register', claim = mode==='claim';
  $('#app').innerHTML = `
  <div class="auth">
    <h1>換班系統</h1>
    <p class="muted">${claim?'帳號已建立,請完成人事資料綁定':reg?'第一次使用?建立你的帳號':'用人事代號登入'}</p>
    <form class="card" data-form="${mode}" autocomplete="on">
      <label class="f" for="f_id">人事代號</label>
      <input type="text" id="f_id" autocomplete="username" autocapitalize="characters" inputmode="text" ${claim?'readonly':''} value="${esc(claim?S.claimId:'')}">
      ${reg||claim?`
      <label class="f" for="f_name">姓名</label><input type="text" id="f_name" autocomplete="name">
      <label class="f" for="f_skill">戰力</label><input type="text" id="f_skill" placeholder="例如:A、資深、8…(同事都看得到)">`:''}
      ${claim?'':`<label class="f" for="f_pw">密碼${reg?'(至少 6 碼)':''}</label><input type="password" id="f_pw" autocomplete="${reg?'new-password':'current-password'}">`}
      ${reg||claim?`<label class="f" for="f_code">邀請碼</label><input type="text" id="f_code" autocomplete="off" placeholder="向管理者索取">`:''}
      <div class="msg err ${note?'show':''}" id="authMsg">${esc(note||'')}</div>
      <button class="btn block" style="margin-top:16px" id="authGo">${claim?'完成綁定':reg?'註冊':'登入'}</button>
    </form>
    <p class="center" style="padding:10px 0">
      ${claim?'<button class="link" data-act="logout">登出</button>':reg?'已有帳號?<button class="link" data-act="authMode" data-mode="login">登入</button>':'第一次使用?<button class="link" data-act="authMode" data-mode="register">註冊</button>'}
    </p>
    <p class="muted small" style="text-align:center">忘記密碼請聯絡管理者重設</p>
  </div>`;
}
function authErr(msg){ const m=$('#authMsg'); if(m){ m.textContent=msg; m.className='msg err show'; } }
function mapAuthError(e){
  const m=(e&&e.message)||String(e);
  if(/Invalid login credentials/i.test(m)) return '人事代號或密碼錯誤';
  if(/at least/i.test(m)) return '密碼至少 6 碼';
  if(/invalid/i.test(m) && /email/i.test(m)) return '帳號格式被系統拒絕(email invalid),請回報管理者:'+m;
  if(/rate limit|too many/i.test(m)) return '嘗試次數太多,請稍後再試';
  return m;
}
async function submitAuth(mode){
  const btn=$('#authGo'); btn.disabled=true;
  try{
    const id = normId($('#f_id').value);
    if(!/^[A-Z0-9]{2,20}$/.test(id)) throw new Error('人事代號只能是英數字');
    if(mode==='login'){
      const pw=$('#f_pw').value; if(!pw) throw new Error('請輸入密碼');
      const {error}=await sb.auth.signInWithPassword({email:emailOf(id),password:pw}); if(error) throw error;
      return await afterLogin();
    }
    const name=$('#f_name').value.trim(), skill=$('#f_skill').value.trim(), code=$('#f_code').value.trim();
    if(!name) throw new Error('請填姓名'); if(!skill) throw new Error('請填戰力'); if(!code) throw new Error('請填邀請碼');
    if(mode==='register'){
      const pw=$('#f_pw').value; if(pw.length<6) throw new Error('密碼至少 6 碼');
      const email=emailOf(id);
      let {data,error}=await sb.auth.signUp({email,password:pw});
      if(error && /already|registered/i.test(error.message)){
        ({data,error}=await sb.auth.signInWithPassword({email,password:pw}));
        if(error) throw new Error('這個人事代號已註冊但密碼不符。請改用登入;忘記密碼請聯絡管理者');
      } else if(error) throw error;
      if(!data.session) throw new Error('專案仍要求信箱驗證,請管理者到 Supabase 關閉 Confirm email');
    }
    const {error:ce}=await sb.rpc('claim_staff',{p_emp:id,p_name:name,p_skill:skill,p_code:code});
    if(ce) throw ce;
    await afterLogin();
  }catch(e){ authErr(mapAuthError(e)); btn.disabled=false; }
}
async function afterLogin(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return renderAuth('login');
  const {data,error} = await sb.from('staff').select('*').eq('auth_user_id',session.user.id).maybeSingle();
  if(error) throw error;

/* ============ 匯入班表 ============ */
function parseSchedule(raw){
  const out={month:null,types:new Map(),shifts:[],off:0,errors:[],warns:[]};
  const seen=new Set(); let sec=null;
  const lines=String(raw).replace(/[｜│¦]/g,'|').replace(/：/g,':').replace(/[–—~～]/g,'-').split(/\r?\n/);
  const normTime=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec((t||'').trim()); return m&&+m[1]<=24&&+m[2]<60?`${pad(+m[1]%24)}:${m[2]}`:null;};
  for(let ln of lines){
    ln=ln.trim().replace(/^[-*•]\s+/,''); if(!ln||/^```/.test(ln)) continue;
    let m;
    if((m=ln.match(/^#\s*MONTH\s*:?\s*(\d{4})\s*-\s*(\d{1,2})/i))){ out.month=`${m[1]}-${pad(+m[2])}`; sec=null; continue; }
    if(/^#\s*TYPES/i.test(ln)){ sec='t'; continue; }
    if(/^#\s*SHIFTS/i.test(ln)){ sec='s'; continue; }
    if(ln.startsWith('#')) continue;
    const p=ln.split('|').map(x=>x.trim());
    if(sec==='t'){
      if(p[0]==='代碼'||p.length<3) { if(p[0]!=='代碼') out.warns.push(`略過無法解讀的班別行:${ln}`); continue; }
      const st=normTime(p[1]), en=normTime(p[2]);
      if(!st||!en){ out.errors.push(`班別 ${p[0]} 的時間格式不對:${p[1]}|${p[2]}`); continue; }
      if(!isOff(p[0])) out.types.set(p[0],{code:p[0],start:st,end:en});
    } else if(sec==='s'){
      if(p[0]==='日期'||p.length<2) { if(p[0]!=='日期') out.warns.push(`略過無法解讀的行:${ln}`); continue; }
      const dm=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(p[0]);
      if(!dm){ out.errors.push(`日期格式不對:${p[0]}`); continue; }
      const ds=`${dm[1]}-${pad(+dm[2])}-${pad(+dm[3])}`; const dt=new Date(+dm[1],+dm[2]-1,+dm[3]);
      if(dt.getMonth()!==+dm[2]-1){ out.errors.push(`不存在的日期:${ds}`); continue; }
      const code=p[1];
      if(!code||code==='?'){ out.errors.push(`${ds} 的班別 AI 看不清楚,請對照截圖手動補上`); continue; }
      if(isOff(code)){ out.off++; continue; }
      if(seen.has(ds)){ out.errors.push(`${ds} 出現兩次`); continue; }
      seen.add(ds); out.shifts.push({date:ds,code});
    }
  }
  if(!out.shifts.length && !out.errors.length) out.errors.push('沒有解析到任何上班日,請確認貼上的是 AI 的完整輸出');
  if(!out.month && out.shifts.length) out.month=out.shifts[0].date.slice(0,7);
  if(!out.month && !out.errors.length) out.errors.push('找不到 #MONTH 月份');
  out.shifts.forEach(s=>{
    if(out.month && !s.date.startsWith(out.month)) out.errors.push(`${s.date} 不在 ${out.month} 內`);
    if(!out.types.has(s.code) && !(S.types.has(s.code))) out.errors.push(`班別 ${s.code} 沒有時間資料(#TYPES 缺少)`);
  });
  out.errors=[...new Set(out.errors)];
  out.shifts.sort((a,b)=>a.date.localeCompare(b.date));
  return out;
}

  <section class="card step"><h3><b>2</b>複製提示詞</h3>
    <p class="small muted">這段指令會讓 AI 輸出系統看得懂的格式(已設定:含 X、Y、Z 的班別視為休假,自動略過)。</p>
    <button class="btn block" data-act="copyPrompt" id="copyBtn">${I.copied?'已複製 ✓ 再複製一次':'複製提示詞'}</button>
    <details><summary>查看提示詞內容</summary><textarea readonly style="min-height:260px" id="promptBox">${esc(PROMPT)}</textarea></details>
  </section>

  <section class="card step"><h3><b>3</b>打開你的 AI</h3>
    <ol>
      <li>點下方連結打開 AI(會開新分頁/App)</li>
      <li>在對話框<b>貼上</b>剛複製的提示詞</li>
      <li>再<b>附上同一張班表截圖</b>,送出</li>
      <li>等它回覆後,按它的「複製」鈕,複製整段結果,再回到這裡</li>
    </ol>
    <div class="row">${AI_LINKS.map(a=>`<a class="btn ghost sm" href="${a.url}" target="_blank" rel="noopener">${a.name} ↗</a>`).join('')}</div>
  </section>

  <section class="card step"><h3><b>4</b>貼上 AI 的結果</h3>
    <textarea id="impText" placeholder="#MONTH 2026-11&#10;#TYPES&#10;…&#10;#SHIFTS&#10;…">${esc(I.text)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn ghost" data-act="pasteClip">從剪貼簿貼上</button><button class="btn" data-act="previewImp">預覽</button></div>
    ${I.parsed?impPreview(I.parsed):''}
  </section>`:''}`;
}
function impPreview(P){
  const ok=!P.errors.length && P.shifts.length;
  const map=new Map(P.shifts.map(s=>[s.date,s.code])); const tmap=P.types;
  const [y,m]=(P.month||'').split('-').map(Number);
  return `<div style="margin-top:16px">
    ${P.errors.length?`<div class="msg err show"><b>需要修正:</b><ul style="margin:6px 0 0;padding-left:18px">${P.errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul><div style="margin-top:6px">可直接修改上方文字後再按「預覽」</div></div>`:''}
    ${P.warns.length?`<div class="msg warn show"><ul style="margin:0;padding-left:18px">${P.warns.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:''}
    ${P.month&&P.shifts.length?`<p style="margin-top:14px"><b>${y} 年 ${m} 月</b> · 上班 <b>${P.shifts.length}</b> 天 · 略過休假 ${P.off} 天</p>
    ${monthGrid(P.month,(ds,d)=>{const c=map.get(ds);return `<div class="cell static"><span class="dn">${d}</span>${c?chipHTML(c,tmap.size?tmap:S.types,hhmm((tmap.get(c)||S.types.get(c)||{}).start||(S.types.get(c)||{}).start_time)):''}</div>`;})}
    <table style="margin-top:10px"><tr><th>班別</th><th>時間</th></tr>${[...new Set(P.shifts.map(s=>s.code))].map(c=>{const t=tmap.get(c)||{start:hhmm((S.types.get(c)||{}).start_time),end:hhmm((S.types.get(c)||{}).end_time)};return `<tr><td>${esc(c)}</td><td>${esc(t.start)}–${esc(t.end)}</td></tr>`;}).join('')}</table>`:''}
    <button class="btn block" style="margin-top:14px" data-act="confirmImp" ${ok?'':'disabled'}>確認匯入</button>
    <p class="muted small">會覆蓋你自己該月份的班表(其他人不受影響)。已經在系統內換過班的月份,請不要用舊截圖重新匯入。</p></div>`;
}
async function confirmImport(){
  const P=S.imp.parsed; if(!P||P.errors.length) return;
  const used=new Set(P.shifts.map(s=>s.code));
  const types=[...used].map(c=>P.types.get(c)).filter(Boolean);
  try{
    const {data,error}=await sb.rpc('import_my_shifts',{p_month:P.month,p_types:types,p_shifts:P.shifts});
    if(error) throw error;
    toast(`已匯入 ${data} 天`); S.imp.text=''; S.imp.parsed=null; S.imp.revealed=false; store.set('imp',{text:'',revealed:false});
    S.page=null; S.tab='cal'; S.month=P.month; S.monthLoaded=null; await loadRefs(); await loadMonth(); renderMain();
  }catch(e){ fail(e); }
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){
    try{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok; }catch(e2){ return false; }
  }
}

/* ============ 事件 ============ */
const H = {
  authMode:b=>renderAuth(b.dataset.mode),
  logout:async()=>{ await sb.auth.signOut(); S.me=null; closeSheet(); renderAuth('login'); },
  tab:b=>{ S.tab=b.dataset.tab; S.page=null; renderMain(); window.scrollTo(0,0); if(S.tab==='swap') loadSwaps().then(renderMain).catch(fail); },
  monthPrev:async()=>{ S.month=prevMonth(S.month); S.monthLoaded=null; renderMain(); try{await loadMonth();}catch(e){fail(e)} renderMain(); },
  monthNext:async()=>{ S.month=nextMonth(S.month); S.monthLoaded=null; renderMain(); try{await loadMonth();}catch(e){fail(e)} renderMain(); },
  logPrev:()=>{ S.logMonth=prevMonth(S.logMonth); renderMain(); },
  logNext:()=>{ S.logMonth=nextMonth(S.logMonth); renderMain(); },
  reload:async()=>{ toast('更新中…'); await refreshAll(); toast('已更新'); },
  openDay:b=>openDay(b.dataset.date),
  closeSheet:()=>closeSheet(),
  dayFilter:b=>{ S.day.filter=b.dataset.code; renderDay(); },
  swapStart:b=>swapStart(b),
  swapSend:()=>swapSend(),
  respond:b=>respond(+b.dataset.id,b.dataset.ok==='1'),
  cancelReq:b=>cancelReq(+b.dataset.id),
  exportCsv:()=>exportCsv(),
  saveProfile:()=>saveProfile(),
  openImport:()=>{ S.page='import'; closeSheet(); renderMain(); window.scrollTo(0,0); },
  closeImport:()=>{ S.page=null; renderMain(); },
  skipImg:()=>{ S.imp.revealed=true; store.set('imp',{text:S.imp.text,revealed:true}); renderMain(); },
  copyPrompt:async b=>{ const ok=await copyText(PROMPT); if(ok){ S.imp.copied=true; S.imp.revealed=true; store.set('imp',{text:S.imp.text,revealed:true}); b.textContent='已複製 ✓ 再複製一次'; toast('提示詞已複製,去貼給 AI 吧'); }
    else { toast('自動複製失敗,請展開「查看提示詞內容」手動全選複製',true); const d=document.querySelector('details'); if(d){d.open=true; const t=$('#promptBox'); t&&t.select();} } },
  pasteClip:async()=>{ try{ const t=await navigator.clipboard.readText(); if(!t) return toast('剪貼簿是空的',true); S.imp.text=t; store.set('imp',{text:t,revealed:true}); S.imp.parsed=parseSchedule(t); renderMain(); }catch(e){ toast('無法讀取剪貼簿,請長按文字框手動貼上',true); } },
  previewImp:()=>{ S.imp.text=$('#impText').value; store.set('imp',{text:S.imp.text,revealed:true}); S.imp.parsed=parseSchedule(S.imp.text); renderMain(); const el=document.querySelector('.msg.show,.btn[data-act=confirmImp]'); el&&el.scrollIntoView({behavior:'smooth',block:'center'}); },
  confirmImp:()=>confirmImport()
};
document.addEventListener('click',e=>{ const a=e.target.closest('[data-act]'); if(!a) return; const f=H[a.dataset.act]; if(f){ e.preventDefault(); Promise.resolve(f(a,e)).catch(fail); } });
document.addEventListener('submit',e=>{ const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault(); submitAuth(f.dataset.form); });
document.addEventListener('input',e=>{ if(e.target.id==='impText'){ S.imp.text=e.target.value; store.set('imp',{text:S.imp.text,revealed:true}); } });
document.addEventListener('change',e=>{
  if(e.target.id==='imgPick' && e.target.files[0]){
    const f=e.target.files[0]; if(S.imp.img) URL.revokeObjectURL(S.imp.img);
    S.imp.img=URL.createObjectURL(f); S.imp.imgName=f.name; S.imp.revealed=true; store.set('imp',{text:S.imp.text,revealed:true}); renderMain();
  }
});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && S.me && Date.now()-S.lastLoad>20000 && !S.page) refreshAll(); });

/* ============ 啟動 ============ */
(async function init(){
  setupIcon();
  try{
    sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT' && S.me){ S.me=null; renderAuth('login'); } });
    const {data:{session}}=await sb.auth.getSession();
    if(!session) return renderAuth('login');
    await afterLogin();
  }catch(e){ renderAuth('login','連線失敗:'+(e.message||e)); }
})();
</script>
</body>
</html>
